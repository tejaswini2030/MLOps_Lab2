name: Lab 2 - House Price Model CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

jobs:
  # ---------- CI: check the code before anything is trained ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

  # ---------- CD: train, check quality, and release the model ----------
  train-and-release:
    name: Train, evaluate and release
    needs: test                                  # only runs if the tests passed
    if: github.event_name != 'pull_request'      # PRs get tested, not released
    runs-on: ubuntu-latest
    permissions:
      contents: write                            # needed to create a GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}              # lets the gh CLI talk to GitHub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the California Housing dataset
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: california-housing-v1

      - name: Generate version timestamp
        run: echo "timestamp=$(date '+%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Train model
        run: python -m src.train --timestamp "$timestamp"

      - name: Evaluate model (quality gate)
        run: python -m src.evaluate --timestamp "$timestamp"

      - name: Get metrics of the last released model
        run: |
          prev_tag=$(gh release list --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("lab2-house-price-"))] | first // empty')
          if [ -n "$prev_tag" ]; then
            echo "Previous release: $prev_tag"
            gh release download "$prev_tag" --pattern metrics.json --dir previous
          else
            echo "No previous release yet."
          fi

      - name: Compare with the last release
        id: compare
        run: python -m src.compare --new "metrics/metrics_${timestamp}.json" --old previous/metrics.json

      - name: Commit the model and metrics to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # -f is needed because models/ and metrics/ are in .gitignore
          # (that keeps local test runs out, while CI-trained models get committed)
          git add -f "models/model_${timestamp}.joblib" "metrics/metrics_${timestamp}.json"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add model and metrics for version ${timestamp}"
            git pull --rebase origin main   # in case main moved while this job ran
            git push origin main
          fi

      - name: Upload model and metrics as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: house-price-model-${{ env.timestamp }}
          path: |
            models/
            metrics/

      - name: Release the new model
        if: steps.compare.outputs.promote == 'true'
        run: |
          cp "metrics/metrics_${timestamp}.json" metrics.json
          r2=$(python -c "import json; print(round(json.load(open('metrics.json'))['r2'], 4))")
          rmse=$(python -c "import json; print(round(json.load(open('metrics.json'))['rmse'], 4))")
          gh release create "lab2-house-price-${timestamp}" \
            "models/model_${timestamp}.joblib" metrics.json \
            --title "House price model ${timestamp}" \
            --notes "R²: ${r2} | RMSE: ${rmse} (in \$100k) | commit ${GITHUB_SHA::7}"
